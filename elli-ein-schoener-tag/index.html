<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef4ec">
  <title>Elli – Ein schöner Tag · DMP Games</title>
  <link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="../game-interaction-guard.css">\n</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="homeButton" type="button" aria-label="Zur Tagesübersicht" title="Zur Übersicht">⌂</button>
      <div class="brand">
        <span class="brand-kicker">DMP Special · Mit Cartoon-Elli durch einen ruhigen Tag</span>
        <strong>Elli – Ein schöner Tag</strong>
      </div>
      <div class="heart-counter" id="heartCounter" aria-live="polite">♡ 0 / 5</div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <footer class="footer">
      <span>Kapitel · ruhiges Tetris · freies Gestalten · in deinem Tempo</span>
      <button id="resetButton" class="text-button" type="button">Tag neu beginnen</button>
    </footer>
  </div>

  <template id="overviewTemplate">
    <section class="overview">
      <div class="hero-card">
        <figure class="elli-character-card" role="img" aria-label="Cartoon-Elli">
          <span class="elli-character" aria-hidden="true"></span>
          <figcaption>Cartoon-Elli</figcaption>
        </figure>
        <div class="hero-copy">
          <p class="eyebrow">Heute muss niemand schnell sein.</p>
          <h1>Ellis ruhiger Tag – Kapitel für Kapitel</h1>
          <p>Fünf ruhige Kapitel werden durch vier entspannte Tetris-Wege verbunden. Kein Countdown, kein Zeitdruck – du gehst einfach Schritt für Schritt.</p>
        </div>
      </div>

      <div class="scene-grid" id="sceneGrid">
        <button class="scene-card" type="button" data-scene="garden">
          <span class="scene-icon" aria-hidden="true">🌷</span>
          <span class="scene-copy"><strong>Gartenrunde</strong><small>Blumen versorgen und kurz draußen sein.</small></span>
          <span class="scene-state" data-state-for="garden">Noch offen</span>
        </button>
        <button class="scene-card" type="button" data-scene="story">
          <span class="scene-icon" aria-hidden="true">📖</span>
          <span class="scene-copy"><strong>Leseecke</strong><small>Eine kleine Geschichte für heute auswählen.</small></span>
          <span class="scene-state" data-state-for="story">Noch offen</span>
        </button>
        <button class="scene-card" type="button" data-scene="basket">
          <span class="scene-icon" aria-hidden="true">🧺</span>
          <span class="scene-copy"><strong>In Ruhe sortieren</strong><small>Sechs Dinge bekommen ihren Platz.</small></span>
          <span class="scene-state" data-state-for="basket">Noch offen</span>
        </button>
        <button class="scene-card" type="button" data-scene="craft">
          <span class="scene-icon" aria-hidden="true">🎨</span>
          <span class="scene-copy"><strong>Basteltisch</strong><small>Ein kleines Bild ganz ohne Vorgaben gestalten.</small></span>
          <span class="scene-state" data-state-for="craft">Noch offen</span>
        </button>
        <button class="scene-card" type="button" data-scene="tea">
          <span class="scene-icon" aria-hidden="true">☕</span>
          <span class="scene-copy"><strong>Kleine Pause</strong><small>Getränk und Lieblingsplatz für den Moment wählen.</small></span>
          <span class="scene-state" data-state-for="tea">Noch offen</span>
        </button>
      </div>

      <section class="day-note" id="dayNote" aria-live="polite"></section>
    </section>
  </template>

  <script src="src/game.js"></script>
</body>
</html>
