<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7d69b">
  <title>Elli – Ein schöner Tag · DMP Games</title>
  <link rel="stylesheet" href="src/style.css?v=13">
  <link rel="stylesheet" href="src/theme.css?v=13">
  <link rel="stylesheet" href="../game-interaction-guard.css">
</head>
<body>
  <div class="ci-sky" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar" data-debug-id="elli.topbar">
      <button class="icon-button" id="homeButton" type="button" aria-label="Zur Tagesübersicht" title="Zur Übersicht">⌂</button>
      <div class="brand">
        <span class="brand-kicker">DMP Special · Elli</span>
        <strong>Ein schöner Tag</strong>
      </div>
      <div class="heart-counter" id="heartCounter" aria-live="polite">♡ 0/5 · 🧩 0/4</div>
    </header>

    <main id="app" class="app" tabindex="-1"></main>

    <footer class="footer">
      <span>Entspannt spielen ♥ kreativ sein ♥ einfach genießen</span>
      <button id="resetButton" class="text-button" type="button">Tag neu beginnen</button>
    </footer>
  </div>

  <template id="overviewTemplate">
    <section class="overview">
      <section class="hero-card ci-hero" data-debug-id="elli.hero" aria-label="Elli – Ein schöner Tag">
        <div class="hero-portrait">
          <img data-debug-id="elli.character.main" src="assets/elli-cartoon.webp?v=13" alt="Cartoon-Elli mit Brille und blauem Schal">
          <div class="welcome-bubble">Schön, dass du da bist! <span aria-hidden="true">♥</span></div>
        </div>

        <div class="hero-copy">
          <div class="elli-logo" aria-label="Elli">
            <span class="elli-logo-name">Elli</span>
            <span class="elli-logo-heart" aria-hidden="true">♥</span>
          </div>
          <div class="wood-sign">Ein schöner Tag <span aria-hidden="true">♥</span></div>
          <p class="hero-motto">Entspannt spielen <b>♥</b> Kreativ sein <b>♥</b> Einfach genießen</p>
          <p class="hero-intro">Fünf gemütliche Kapitel und vier ruhige Tetris-Wege führen gemeinsam durch Ellis Tag. Nichts läuft gegen die Uhr.</p>
        </div>

        <aside class="hero-values" aria-label="Ellis Welt">
          <span>KINDER</span>
          <span>NATUR</span>
          <span>BASTELN</span>
          <span>LERNEN</span>
          <span>GEMEINSAM</span>
        </aside>
      </section>

      <section class="journey-shell" data-debug-id="elli.journey" aria-labelledby="journeyTitle">
        <div class="journey-heading">
          <div>
            <span class="eyebrow">Dein Tag</span>
            <h2 id="journeyTitle">Kapitel für Kapitel</h2>
          </div>
          <span class="journey-hint">Seitlich wischen oder scrollen</span>
        </div>
        <div class="scene-grid journey-grid" id="sceneGrid"></div>
      </section>

      <section class="day-note" data-debug-id="elli.status" id="dayNote" aria-live="polite"></section>
    </section>
  </template>

  <script src="src/game.js?v=13"></script>
</body>
</html>
