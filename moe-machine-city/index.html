<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b22">
<title>Moe – Machine City</title>
<link rel="stylesheet" href="../game-interaction-guard.css">
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#081319}
#game{display:block;border:0;width:100%;height:100%;height:100dvh;background:#081319}
</style>
</head>
<body>
<iframe id="game" src="./game-original.html" title="Moe – Machine City" allow="autoplay; fullscreen"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument;
      if(!d) return;
      if(!d.querySelector('meta[name="viewport"]')){
        const m=d.createElement('meta');
        m.name='viewport';
        m.content='width=device-width,initial-scale=1,viewport-fit=cover';
        d.head.appendChild(m);
      }
      const s=d.createElement('style');
      s.textContent='html,body,body *{-webkit-user-select:none!important;user-select:none!important}html,body{-webkit-touch-callout:none!important}input,textarea,select,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}img,svg,canvas{-webkit-user-drag:none!important;user-drag:none!important}';
      d.head.appendChild(s);
    }catch(e){}
  });
})();
</script>
</body>
</html>
