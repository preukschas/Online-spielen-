name: Höfen echte Ortsgeodaten beschaffen
on:
  push:
    paths:
      - 'simulationen/geodata-pipeline/build-hoefen-osm.mjs'
      - '.github/workflows/hoefen-geodata.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hoefen-geodata-snapshot
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifizierte OSM-Daten für Höfen abrufen
        run: node simulationen/geodata-pipeline/build-hoefen-osm.mjs
      - name: Echtdaten-Snapshot versionieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulationen/vorschau-hoefen/hoefen-ortsdaten.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "data(hoefen): verified OpenStreetMap snapshot (ODbL)"
          git pull --rebase origin main
          git push origin HEAD:main
