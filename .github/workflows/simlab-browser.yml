name: SimLab Browser Freigabe
on:
  push:
    paths:
      - 'simulationen/**'
      - '.github/workflows/simlab-browser.yml'
  pull_request:
    paths:
      - 'simulationen/**'
      - '.github/workflows/simlab-browser.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright installieren
        run: npm install --no-save playwright@1.56.1
      - name: Chromium und WebKit installieren
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop und Mobile Browser testen
        run: node simulationen/tests/browser-smoke.mjs
      - name: Gelenk-Lernarena in Chromium, WebKit iPhone und iPad testen
        run: node simulationen/tests/joint-walker-browser.mjs
      - name: Formate und Entitäten-Editor prüfen
        run: node simulationen/tests/phase1-regression.mjs
      - name: Screenshots archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simlab-browser-screenshots
          path: test-artifacts
          if-no-files-found: ignore
