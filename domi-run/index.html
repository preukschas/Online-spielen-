<meta charset="utf-8">

<title>Domi Run</title>
<style>
:root{--wood:#5f351c;--wood2:#8d5931;--green:#48ad2b;--green2:#84dd4c;--cream:#fff8e9;--ink:#17212b;--muted:#667085}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eeeae1;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overscroll-behavior-y:contain}button{font:inherit;-webkit-tap-highlight-color:transparent}.hide{display:none!important}
main{width:min(100%,980px);margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.splash{position:relative;border-radius:22px;overflow:hidden;background:#76b9ed;box-shadow:0 10px 30px #0002;cursor:pointer;user-select:none;-webkit-user-select:none}.splash img{display:block;width:100%;height:auto;pointer-events:none}.play{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);width:min(46%,360px);min-height:58px;border:3px solid #2d761b;border-radius:16px;background:linear-gradient(#88e150,#43ae25);color:#fff;font-weight:950;font-size:clamp(20px,4vw,34px);letter-spacing:.02em;text-shadow:0 2px 2px #0007;box-shadow:0 5px 0 #276718,0 10px 22px #0003;cursor:pointer}.play:active{transform:translate(-50%,3px);box-shadow:0 2px 0 #276718}.start-note{position:absolute;left:50%;top:4%;transform:translateX(-50%);padding:6px 11px;border-radius:999px;background:#253727cc;color:#fff;font-size:clamp(11px,2vw,14px);font-weight:800;white-space:nowrap}
.game{position:relative}.stage{position:relative;overflow:hidden;border-radius:22px;background:#79bdec;box-shadow:0 10px 30px #0002}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.hud{position:absolute;inset:10px 10px auto 10px;display:flex;gap:7px;align-items:center;pointer-events:none}.pill{padding:7px 10px;border:2px solid #a66a36;border-radius:12px;background:linear-gradient(var(--wood2),var(--wood));color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px #0008;box-shadow:inset 0 1px #fff4,0 2px 6px #0002}.spacer{flex:1}.zone{position:absolute;top:51px;left:12px;padding:4px 8px;border-radius:9px;background:#ffffffd9;color:#36503a;font-size:11px;font-weight:900;pointer-events:none}.progress{position:absolute;top:55px;left:132px;right:12px;height:9px;border-radius:999px;background:#ffffff80;border:1px solid #fff;overflow:hidden;pointer-events:none}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#68cf3b,#ffd43c)}.message{position:absolute;top:77px;left:50%;transform:translateX(-50%);max-width:86%;padding:7px 11px;border-radius:11px;background:#3d291be8;border:2px solid #9c6338;color:#fff;font-weight:850;font-size:13px;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.message.show{opacity:1}.combo{position:absolute;right:14px;top:86px;padding:6px 9px;border-radius:10px;background:#fff7;color:#674018;font-weight:950;font-size:12px;opacity:0;transform:scale(.9);transition:.12s;pointer-events:none}.combo.show{opacity:1;transform:scale(1)}
.controls{display:grid;grid-template-columns:1.35fr 1fr .52fr;gap:8px;margin-top:9px}.ctrl{min-height:58px;border:2px solid #694126;border-radius:15px;background:linear-gradient(#986440,#673f25);color:#fff;font-weight:950;font-size:16px;touch-action:none;box-shadow:0 3px 0 #4e301d}.ctrl.primary{background:linear-gradient(var(--green2),var(--green));border-color:#2c751b;box-shadow:0 3px 0 #276718}.ctrl:active,.ctrl.active{transform:translateY(2px);box-shadow:0 1px 0 #4e301d}.ctrl.primary:active{box-shadow:0 1px 0 #276718}.energy-wrap{display:flex;align-items:center;gap:8px;margin-top:8px}.energy-label{font-size:11px;font-weight:850;color:#5e4a38}.energy{flex:1;height:8px;border-radius:999px;background:#cfd5da;overflow:hidden}.energy i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#56b8ee,#76d33f);transition:width .08s linear}.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:7px}.end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#09162166;backdrop-filter:blur(2px)}.card{width:min(410px,92%);padding:20px;border:3px solid #8d5931;border-radius:20px;background:#fffaf2f7;text-align:center;box-shadow:0 12px 35px #0004}.card h2{margin:0 0 8px}.card p{margin:0 0 13px;color:#475467;line-height:1.35}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{padding:8px 4px;border-radius:11px;background:#f0e5ce;font-weight:900;font-size:12px}.card button{width:100%;min-height:50px;border:2px solid #2c751b;border-radius:13px;background:linear-gradient(var(--green2),var(--green));color:#fff;font-weight:950;font-size:16px}.error{margin-top:8px;padding:9px 11px;border-radius:12px;background:#fff0ee;border:1px solid #e6aaa4;color:#8b2b24;font-size:12px;font-weight:750}.shield-badge{margin-left:4px}.sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media(max-width:520px){main{padding-left:4px;padding-right:4px}.pill{padding:5px 7px;font-size:11px}.hud{inset:7px 7px auto}.zone{top:44px;left:8px;font-size:10px}.progress{top:47px;left:118px;right:8px}.message{top:63px;font-size:10px}.combo{top:68px;right:9px;font-size:10px}.controls{gap:5px}.ctrl{min-height:52px;font-size:13px}.hint{font-size:11px}.start-note{top:3%;font-size:10px}}
@media(prefers-reduced-motion:reduce){.message,.combo,.energy i{transition:none}}
</style>
</head>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const app=$('app'),splash=$('splash'),game=$('game'),play=$('play'),c=$('canvas'),x=c.getContext('2d'),spr=$('sprite'),starsEl=$('stars'),heartsEl=$('hearts'),metersEl=$('meters'),prog=$('progress'),msg=$('message'),comboEl=$('combo'),zoneEl=$('zone'),energyEl=$('energy'),jumpBtn=$('jump'),sprintBtn=$('sprint'),pauseBtn=$('pause'),end=$('end'),endTitle=$('endTitle'),endText=$('endText'),endStars=$('endStars'),endScore=$('endScore'),endBest=$('endBest'),again=$('again'),live=$('live'),shieldBadge=$('shieldBadge'),errorEl=$('error');
const W=960,H=540,G=430,GOAL=1300,REQ_STARS=12;const CFG={gravity:1880,jump:-720,doubleJump:-615,coyote:.12,buffer:.13,cut:.56};const reduce=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let raf=0,last=0,running=false,paused=false,meters=0,stars=0,hearts=3,score=0,best=loadBest(),energy=100,sprinting=false,coffee=0,shield=false,inv=0,shake=0,obT=1.4,freeStarT=.7,powerT=8,msgT=0,comboT=0,checkpoint=0,zoneIndex=-1,bonusPath=false,lastObstacleX=-999,obs=[],pickups=[],parts=[],floaters=[];
const p={x:215,y:G,vy:0,grounded:true,coyote:CFG.coyote,jumpBuffer:0,jumpsUsed:0,jumpHeld:false,phase:0,land:0};
const zones=[{at:0,name:'🌼 Wiesenweg'},{at:325,name:'💧 Seeufer'},{at:650,name:'🏘️ Bergdorf'},{at:975,name:'🌲 Höhenwald'}];
function loadBest(){try{return Number(localStorage.getItem('domi-run-best')||0)||0}catch{return 0}}function saveBest(){if(score>best){best=Math.floor(score);try{localStorage.setItem('domi-run-best',String(best))}catch{}}}
function hud(){starsEl.textContent=stars;heartsEl.textContent=hearts;metersEl.textContent=Math.floor(meters);prog.style.width=Math.min(100,meters/GOAL*100)+'%';energyEl.style.width=Math.max(0,energy)+'%';shieldBadge.textContent=shield?'🍀':'';}
function say(t,s=1.35){msg.textContent=t;msg.classList.add('show');msgT=s;}
function showCombo(){if(score<=0)return;comboEl.textContent=`✨ Serie ×${Math.max(2,Math.min(9,cleanStreak+1))}`;comboEl.classList.add('show');comboT=.8;}
function burst(px,py,n,col='#ffd33d'){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*230,vy:-60-Math.random()*190,l:.45+Math.random()*.45,s:2+Math.random()*4,c:col});}
function floatText(px,py,t,col='#fff'){floaters.push({x:px,y:py,t,c,l:1});}
let cleanStreak=0;
function reset(){cancelAnimationFrame(raf);running=true;paused=false;meters=0;stars=0;hearts=3;score=0;energy=100;sprinting=false;coffee=0;shield=false;inv=0;shake=0;obT=1.45;freeStarT=.55;powerT=7.5;msgT=0;comboT=0;checkpoint=0;zoneIndex=-1;bonusPath=false;lastObstacleX=-999;cleanStreak=0;obs=[];pickups=[];parts=[];floaters=[];Object.assign(p,{y:G,vy:0,grounded:true,coyote:CFG.coyote,jumpBuffer:0,jumpsUsed:0,jumpHeld:false,phase:0,land:0});end.classList.add('hide');pauseBtn.textContent='PAUSE';errorEl.classList.add('hide');hud();updateZone(true);say('12 Sterne sammeln · Gipfel erreichen',1.8);last=performance.now();draw();}
function start(ev){if(ev)ev.stopPropagation();splash.classList.add('hide');game.classList.remove('hide');app.focus({preventScroll:true});reset();raf=requestAnimationFrame(loop);live.textContent='Domi Run gestartet';}
function requestJump(){if(!running||paused)return;p.jumpBuffer=CFG.buffer;p.jumpHeld=true;tryJump();}
function releaseJump(){p.jumpHeld=false;if(p.vy<-240)p.vy*=CFG.cut;}
function tryJump(){if(p.jumpBuffer<=0)return;const first=p.grounded||p.coyote>0;if(first){p.vy=CFG.jump;p.grounded=false;p.coyote=0;p.jumpsUsed=1;p.jumpBuffer=0;burst(p.x,p.y-10,6,'#fff2a2');floatText(p.x,p.y-125,'HOP!','#fff8bc');}else if(p.jumpsUsed<2){p.vy=CFG.doubleJump;p.jumpsUsed=2;p.jumpBuffer=0;burst(p.x,p.y-50,9,'#aee9ff');floatText(p.x,p.y-135,'DOPPEL!','#d8f5ff');}}
function setSprint(v){if(!running||paused)return;sprinting=!!v&&energy>2;sprintBtn.classList.toggle('active',sprinting);}
function togglePause(){if(!running)return;paused=!paused;sprinting=false;sprintBtn.classList.remove('active');pauseBtn.textContent=paused?'WEITER':'PAUSE';if(paused){cancelAnimationFrame(raf);draw();live.textContent='Pause';}else{last=performance.now();raf=requestAnimationFrame(loop);live.textContent='Weiter';}}
function finish(win){if(!running)return;running=false;sprinting=false;cancelAnimationFrame(raf);saveBest();end.classList.remove('hide');endTitle.textContent=win?'🏔️ Gipfel erreicht!':'🌿 Kleine Pause';endText.textContent=win?'Domi und sein Begleiter sind oben angekommen. Ruhig, freundlich und mit einer ordentlichen Portion Sterne.':'Kein Stress – beim nächsten Lauf geht es einfach weiter.';endStars.textContent=stars;endScore.textContent=Math.floor(score);endBest.textContent=best;live.textContent=endTitle.textContent;draw();}
function difficulty(){return Math.min(1,meters/GOAL)}
function addObstacle(){if(obs.length&&obs[obs.length-1].x>W-155){obT=.22;return;}const d=difficulty(),r=Math.random();let type=r<.32?'crate':r<.62?'log':r<.84?'puddle':'stump';if(meters<120&&type==='stump')type='puddle';const dims={crate:[58,58],log:[94,31],puddle:[104,16],stump:[54,74]}[type];const o={type,x:W+72,y:G,w:dims[0],h:dims[1],hit:false,passed:false};obs.push(o);lastObstacleX=o.x;if(Math.random()<.72)spawnArcFor(o);const base=1.48-d*.34;obT=base+Math.random()*(.55-d*.12);}
function spawnArcFor(o){const high=o.type==='stump'||o.type==='crate';const y=G-(high?155:112);const n=high?3:2;for(let i=0;i<n;i++)pickups.push({type:'star',x:o.x+10+i*54,y:y-Math.sin(i*Math.PI/(n-1||1))*38,a:Math.random()*6.28});}
function addFreeStars(){const n=Math.random()<.38?3:1,base=G-100-Math.random()*95;for(let i=0;i<n;i++)pickups.push({type:'star',x:W+70+i*55,y:base-(n===3?Math.sin(i*Math.PI/2)*38:0),a:Math.random()*6.28});freeStarT=1.25+Math.random()*1.45;}
function addPower(){const r=Math.random();let type;if(hearts<3&&r<.28)type='heart';else type=r<.62?'coffee':'clover';pickups.push({type,x:W+75,y:G-125-Math.random()*55,a:0});powerT=9+Math.random()*7;}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hurt(o){if(inv>0||o.hit)return;o.hit=true;if(shield){shield=false;inv=.8;shake=.08;burst(p.x,p.y-70,14,'#9ee76c');say('Kleeblatt hat dich geschützt 🍀',1.1);floatText(p.x,p.y-150,'GESCHÜTZT','#c9ff99');hud();return;}hearts--;cleanStreak=0;inv=1.35;shake=.18;burst(p.x,p.y-70,14,'#ff7c7c');say(hearts?'Hoppla – weiter geht’s!':'Zeit für eine kleine Pause 🌿',1.1);hud();if(hearts<=0)finish(false);}
function collect(z){if(z.type==='star'){cleanStreak++;if(stars<REQ_STARS){stars++;const gain=100+Math.min(5,cleanStreak)*20;score+=gain;burst(z.x,z.y,10);floatText(z.x,z.y-20,`+${gain}`,'#fff2a5');if(cleanStreak>=2)showCombo();say(stars===REQ_STARS?'Alle Sterne – jetzt zum Gipfel!':`Stern ${stars} von ${REQ_STARS}`,.55);}else{score+=60;burst(z.x,z.y,7,'#ffe98a');floatText(z.x,z.y-20,'BONUS +60','#fff2a5');}}else if(z.type==='coffee'){energy=Math.min(100,energy+55);coffee=4;score+=120;burst(z.x,z.y,12,'#d79b58');say('Kaffee-Turbo ☕',.8);floatText(z.x,z.y-20,'ENERGIE +','#ffe0a8');}else if(z.type==='clover'){shield=true;score+=120;burst(z.x,z.y,12,'#9be36a');say('Kleeblatt-Schutz 🍀',.8);floatText(z.x,z.y-20,'SCHUTZ','#d4ffad');}else{hearts=Math.min(3,hearts+1);score+=140;burst(z.x,z.y,12,'#ff8fa1');say('Ein Herz zurück ❤️',.8);floatText(z.x,z.y-20,'HERZ +','#ffd5dc');}hud();}
function updateZone(force=false){let zi=0;for(let i=0;i<zones.length;i++)if(meters>=zones[i].at)zi=i;if(force||zi!==zoneIndex){zoneIndex=zi;zoneEl.textContent=zones[zi].name;if(!force)say(zones[zi].name,1.15);}}
function update(d){let speed=278+Math.min(42,meters/36);if(coffee>0){coffee-=d;speed+=28;}if(sprinting&&energy>0){speed+=112;energy=Math.max(0,energy-31*d);if(energy<=0)setSprint(false);}else energy=Math.min(100,energy+19*d);meters+=speed*d/17.5;score+=d*(6+difficulty()*5);p.phase+=d*(sprinting?11:8.2);p.jumpBuffer=Math.max(0,p.jumpBuffer-d);if(p.grounded)p.coyote=CFG.coyote;else p.coyote=Math.max(0,p.coyote-d);tryJump();p.vy+=CFG.gravity*d;p.y+=p.vy*d;if(p.y>=G){if(!p.grounded&&p.vy>450)p.land=.1;p.y=G;p.vy=0;p.grounded=true;p.jumpsUsed=0;}else p.grounded=false;if(p.land>0)p.land-=d;if(inv>0)inv-=d;if(shake>0)shake-=d;if(msgT>0){msgT-=d;if(msgT<=0)msg.classList.remove('show');}if(comboT>0){comboT-=d;if(comboT<=0)comboEl.classList.remove('show');}updateZone();
obT-=d;if(obT<=0)addObstacle();freeStarT-=d;if(freeStarT<=0)addFreeStars();powerT-=d;if(powerT<=0)addPower();
const pr={x:p.x-27,y:p.y-134,w:55,h:126};const nextObs=[];for(const o of obs){o.x-=speed*d;const shrink=o.type==='puddle'?8:5;const or={x:o.x-o.w/2+shrink,y:o.y-o.h+4,w:o.w-shrink*2,h:o.h-4};if(hit(pr,or))hurt(o);if(!o.passed&&o.x+o.w/2<p.x){o.passed=true;if(!o.hit){cleanStreak++;score+=35+Math.min(5,cleanStreak)*5;if(!p.grounded){score+=25;floatText(p.x,p.y-145,'SAUBER! +25','#eaffb0');}if(cleanStreak>=3)showCombo();}}if(o.x>-150)nextObs.push(o);}obs=nextObs;
const nextPick=[];for(const z of pickups){z.x-=speed*d;z.a+=d*5;const zy=z.y+Math.sin(z.a)*6,dx=z.x-p.x,dy=zy-(p.y-78);if(dx*dx+dy*dy<48*48)collect(z);else if(z.x>-55)nextPick.push(z);}pickups=nextPick;
for(const q of parts){q.x+=q.vx*d;q.y+=q.vy*d;q.vy+=440*d;q.l-=d;}parts=parts.filter(q=>q.l>0);for(const f of floaters){f.y-=34*d;f.l-=d;}floaters=floaters.filter(f=>f.l>0);
const cp=Math.floor(meters/325);if(cp>checkpoint&&cp<=3){checkpoint=cp;say(`Etappe ${cp}/4 geschafft 🌿`,1.2);}if(meters>=GOAL){if(stars>=REQ_STARS)finish(true);else if(!bonusPath){bonusPath=true;say(`Noch ${REQ_STARS-stars} Sterne – entspannter Bonusweg!`,2);obT=Math.max(obT,1.8);freeStarT=.08;}}if(bonusPath&&stars<REQ_STARS){freeStarT=Math.min(freeStarT,.42);obT=Math.max(obT,.9);}if(bonusPath&&stars>=REQ_STARS)finish(true);hud();}
function rr(px,py,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function pine(px,py,s,c='#356943'){x.fillStyle=c;for(let i=0;i<3;i++){x.beginPath();x.moveTo(px,py-s*(.95-i*.24));x.lineTo(px-s*(.34+i*.05),py-s*(.42-i*.13));x.lineTo(px+s*(.34+i*.05),py-s*(.42-i*.13));x.closePath();x.fill();}x.fillStyle='#674931';x.fillRect(px-2,py-s*.12,4,s*.12);}
function cloud(px,py,s){x.fillStyle='#ffffffbb';x.beginPath();x.arc(px,py,s*.34,0,6.28);x.arc(px+s*.32,py-s*.06,s*.43,0,6.28);x.arc(px+s*.7,py,s*.31,0,6.28);x.fill();}
function bg(){const z=zoneIndex<0?0:zoneIndex;const sky=x.createLinearGradient(0,0,0,H);const skies=[['#68baf3','#dff1ff','#ffe9b9'],['#65b7ef','#d8f1ff','#dff4dd'],['#77bdea','#e5f0f5','#f2dfb0'],['#73aee1','#dde8f2','#e6e3c9']][z];sky.addColorStop(0,skies[0]);sky.addColorStop(.63,skies[1]);sky.addColorStop(1,skies[2]);x.fillStyle=sky;x.fillRect(0,0,W,H);const off=reduce?0:meters*5.1;for(let i=0;i<5;i++)cloud(((i*245-off*.045)%(W+340))-90,70+(i%2)*65,70-(i%3)*8);x.fillStyle=z>=3?'#b5c4cf':'#a0b8ca';x.beginPath();x.moveTo(0,310);for(let q=-90;q<=W+90;q+=100)x.lineTo(q,205+Math.abs(Math.sin((q-off*.05)/150))*82);x.lineTo(W,365);x.lineTo(0,365);x.fill();x.fillStyle=z>=3?'#78909f':'#718f9e';x.beginPath();x.moveTo(0,342);for(let q=-90;q<=W+90;q+=115)x.lineTo(q,270+Math.abs(Math.sin((q-off*.09)/125))*57);x.lineTo(W,390);x.lineTo(0,390);x.fill();if(z===1){const water=x.createLinearGradient(0,330,0,414);water.addColorStop(0,'#8bd6ee');water.addColorStop(1,'#4799bf');x.fillStyle=water;x.fillRect(0,330,W,84);x.fillStyle='#ffffff66';for(let i=0;i<8;i++)x.fillRect(((i*150-off*.15)%(W+160))-60,350+(i%3)*17,84,2);}else{x.fillStyle=z===2?'#8db47f':'#76a968';x.fillRect(0,342,W,72);}if(z===2){const vx=690-((off*.11)%250);for(let i=0;i<6;i++){const px=vx+i*46;x.fillStyle=i%2?'#e7d7bf':'#d7c3a7';x.fillRect(px,360-(i%2)*8,32,44+(i%2)*8);x.fillStyle='#835942';x.beginPath();x.moveTo(px-3,361-(i%2)*8);x.lineTo(px+16,342-(i%2)*8);x.lineTo(px+35,361-(i%2)*8);x.closePath();x.fill();}x.fillStyle='#eee5db';x.fillRect(vx+122,321,17,82);x.fillStyle='#765145';x.beginPath();x.moveTo(vx+117,321);x.lineTo(vx+130,296);x.lineTo(vx+144,321);x.closePath();x.fill();}
const treeCount=z===3?17:13;for(let i=-1;i<treeCount;i++){const px=((i*92-off*.58)%(W+210))-60;pine(px,G-8,64+(i%4)*10,z===3?(i%2?'#274f36':'#386646'):(i%2?'#315e3b':'#47764b'));}x.fillStyle='#6f5239';x.fillRect(0,G,W,H-G);x.fillStyle=z===3?'#75a545':'#82b64d';x.fillRect(0,G-16,W,19);x.fillStyle='#9bd05c';for(let i=0;i<26;i++){const fx=((i*47-off)%1100)-30;x.beginPath();x.arc(fx,G-18-(i%3)*3,2.4+(i%2),0,6.28);x.fill();}}
function obstacle(o){const a=o.x,b=o.y;x.save();x.shadowColor='#0003';x.shadowBlur=6;x.shadowOffsetY=3;if(o.type==='crate'){x.fillStyle='#aa6c34';x.strokeStyle='#5f3819';x.lineWidth=4;x.fillRect(a-29,b-58,58,58);x.strokeRect(a-29,b-58,58,58);x.beginPath();x.moveTo(a-24,b-53);x.lineTo(a+24,b-5);x.moveTo(a+24,b-53);x.lineTo(a-24,b-5);x.stroke();}else if(o.type==='log'){x.fillStyle='#785030';rr(a-47,b-31,94,31,13);x.fill();x.fillStyle='#aa7447';x.beginPath();x.arc(a+39,b-15,13,0,6.28);x.fill();}else if(o.type==='stump'){x.fillStyle='#79512e';rr(a-27,b-74,54,74,13);x.fill();x.fillStyle='#a97643';x.beginPath();x.ellipse(a,b-72,27,9,0,0,6.28);x.fill();x.strokeStyle='#68401e';x.lineWidth=2;x.beginPath();x.arc(a,b-72,14,0,6.28);x.stroke();}else{x.shadowBlur=0;x.fillStyle='#4296c0cc';x.beginPath();x.ellipse(a,b-5,52,11,0,0,6.28);x.fill();x.strokeStyle='#ffffff99';x.lineWidth=2;x.beginPath();x.arc(a-10,b-8,14,3.4,5.6);x.stroke();}x.restore();}
function pickup(z){const yy=z.y+Math.sin(z.a)*6;x.save();x.translate(z.x,yy);if(z.type==='star'){x.scale(.84+.16*Math.abs(Math.cos(z.a)),1);x.fillStyle='#ffd22c';x.strokeStyle='#e5960f';x.lineWidth=4;x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?8:18,xx=Math.cos(a)*r,yy2=Math.sin(a)*r;i?x.lineTo(xx,yy2):x.moveTo(xx,yy2);}x.closePath();x.fill();x.stroke();}else{const emoji=z.type==='coffee'?'☕':z.type==='heart'?'❤️':'🍀';x.font='34px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(emoji,0,0);}x.restore();}
function dog(){const a=112,b=G-10+Math.sin(p.phase*2)*2;x.save();x.shadowColor='#0003';x.shadowBlur=5;x.shadowOffsetY=3;x.fillStyle='#dc9c48';x.beginPath();x.ellipse(a,b-26,36,20,0,0,6.28);x.arc(a+30,b-43,16,0,6.28);x.fill();x.strokeStyle='#dc9c48';x.lineWidth=11;x.lineCap='round';x.beginPath();x.moveTo(a-28,b-27);x.quadraticCurveTo(a-53,b-48,a-59,b-25);x.stroke();x.fillStyle='#845329';x.beginPath();x.ellipse(a+21,b-54,7,12,-.5,0,6.28);x.fill();x.fillStyle='#26211f';x.beginPath();x.arc(a+36,b-47,2.5,0,6.28);x.arc(a+44,b-40,3,0,6.28);x.fill();x.restore();}
function player(){const frame=p.jumpsUsed>0?2:(sprinting?1:(Math.floor(p.phase*1.3)%2)),sw=spr.naturalWidth/4,sh=spr.naturalHeight,dw=168,dh=p.land>0?214:224,bob=p.grounded?Math.sin(p.phase*2)*2:0;x.save();x.globalAlpha=inv>0&&Math.floor(inv*12)%2===0?.42:1;x.fillStyle='#0003';x.beginPath();x.ellipse(p.x+3,G+2,45,9,0,0,6.28);x.fill();if(shield){x.strokeStyle='#a9f06f';x.lineWidth=5;x.globalAlpha=.75;x.beginPath();x.arc(p.x,p.y-98,72+Math.sin(performance.now()/120)*2,0,6.28);x.stroke();x.globalAlpha=1;}if(spr.complete&&spr.naturalWidth)x.drawImage(spr,frame*sw,0,sw,sh,p.x-dw*.45,p.y-dh+bob,dw,dh);else{fallbackPlayer();}x.restore();}
function fallbackPlayer(){x.fillStyle='#e7eef6';rr(p.x-34,p.y-110,68,82,14);x.fill();x.fillStyle='#c99270';x.beginPath();x.arc(p.x,p.y-132,29,0,6.28);x.fill();x.fillStyle='#4b382f';x.beginPath();x.arc(p.x,p.y-122,29,.1,3.04);x.fill();}
function draw(){x.save();if(shake>0&&!reduce)x.translate((Math.random()-.5)*8,(Math.random()-.5)*5);bg();for(const z of pickups)pickup(z);for(const o of obs)obstacle(o);dog();player();for(const q of parts){x.globalAlpha=Math.max(0,q.l);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.s,0,6.28);x.fill();}x.globalAlpha=1;x.font='900 16px system-ui';x.textAlign='center';for(const f of floaters){x.globalAlpha=Math.max(0,f.l);x.fillStyle=f.c;x.fillText(f.t,f.x,f.y);}x.globalAlpha=1;if(sprinting&&!reduce){x.strokeStyle='#ffffff88';x.lineWidth=3;for(let i=0;i<5;i++){const yy=175+i*46;x.beginPath();x.moveTo(18,yy);x.lineTo(110,yy);x.stroke();}}if(paused){x.fillStyle='#0b17226b';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='900 42px system-ui';x.textAlign='center';x.fillText('PAUSE',W/2,H/2);}x.restore();}
function loop(n){if(!running||paused)return;const d=Math.min(.032,(n-last)/1000);last=n;update(d);draw();if(running&&!paused)raf=requestAnimationFrame(loop);}
function pointerJumpDown(e){e.preventDefault();requestJump();app.focus({preventScroll:true});}function pointerJumpUp(e){e.preventDefault();releaseJump();}
play.addEventListener('click',start);splash.addEventListener('click',e=>{if(e.target!==play)start(e)});splash.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start(e)}});jumpBtn.addEventListener('pointerdown',pointerJumpDown);['pointerup','pointercancel','pointerleave'].forEach(ev=>jumpBtn.addEventListener(ev,pointerJumpUp));c.addEventListener('pointerdown',pointerJumpDown);c.addEventListener('pointerup',pointerJumpUp);c.addEventListener('pointercancel',pointerJumpUp);pauseBtn.addEventListener('click',togglePause);again.addEventListener('click',()=>{reset();raf=requestAnimationFrame(loop)});const sprintDown=e=>{e.preventDefault();setSprint(true);app.focus({preventScroll:true})},sprintUp=e=>{e.preventDefault();setSprint(false)};sprintBtn.addEventListener('pointerdown',sprintDown);['pointerup','pointercancel','pointerleave'].forEach(ev=>sprintBtn.addEventListener(ev,sprintUp));app.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if((e.key===' '||e.key==='ArrowUp'||k==='w')&&!e.repeat){e.preventDefault();requestJump();}if((e.key==='Shift'||k==='d')&&!e.repeat)setSprint(true);if(k==='p'&&!e.repeat)togglePause();});app.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(e.key===' '||e.key==='ArrowUp'||k==='w')releaseJump();if(e.key==='Shift'||k==='d')setSprint(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause();});window.addEventListener('blur',()=>{if(running&&!paused)setSprint(false)});window.addEventListener('error',e=>{errorEl.textContent='Technischer Fehler: '+(e.message||'unbekannt');errorEl.classList.remove('hide');});
window.__domiRun={snapshot:()=>({running,paused,meters,stars,hearts,score,energy,sprinting,shield,player:{...p},obstacles:obs.length,pickups:pickups.length,obstacleData:obs.map(o=>({type:o.type,x:o.x,y:o.y,w:o.w,h:o.h,hit:o.hit})),pickupData:pickups.map(z=>({type:z.type,x:z.x,y:z.y})),zone:zones[Math.max(0,zoneIndex)].name}),start:()=>start(),jump:()=>requestJump(),release:()=>releaseJump(),sprint:v=>setSprint(v),pause:()=>togglePause()};draw();
})();
