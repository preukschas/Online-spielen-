<style>

  #subHud{position:absolute;top:calc(max(9px,env(safe-area-inset-top)) + 116px);left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4;pointer-events:none;white-space:nowrap}.pill{background:rgba(18,24,21,.68);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(8px);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;box-shadow:0 5px 16px rgba(0,0,0,.12)}.pill.hot{color:#ffe07c}.pill.power{color:#9cecff}
  #actions{position:absolute;right:10px;top:calc(max(9px,env(safe-area-inset-top)) + 122px);display:flex;gap:6px;z-index:6}.iconbtn{border:1px solid var(--line);background:var(--glass);color:white;border-radius:13px;width:42px;height:42px;font-size:18px;font-weight:1000;backdrop-filter:blur(9px);box-shadow:0 7px 20px rgba(0,0,0,.15)}.iconbtn:active{transform:scale(.96)}
  #controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));padding:0 11px;display:flex;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}.cluster{display:flex;gap:8px;pointer-events:auto}.ctrl{width:min(18.5vw,80px);height:min(18.5vw,80px);max-width:80px;max-height:80px;border:1px solid rgba(255,255,255,.20);border-radius:21px;background:rgba(15,21,18,.56);backdrop-filter:blur(8px);color:white;font-size:29px;font-weight:1000;box-shadow:0 9px 24px rgba(0,0,0,.16);touch-action:none}.ctrl:active,.ctrl.active{transform:scale(.95);background:rgba(58,70,63,.78)}
  #boostBtn{position:absolute;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 8px);transform:translateX(-50%);z-index:6;border:1px solid rgba(255,255,255,.25);background:linear-gradient(180deg,#ffdf74,#eaa933);color:#2d2109;border-radius:999px;padding:11px 18px;font-size:13px;font-weight:1000;letter-spacing:.05em;box-shadow:0 7px 0 #9c6617,0 13px 28px rgba(0,0,0,.26);opacity:.38;pointer-events:none;transition:.16s}.boostReady{opacity:1!important;pointer-events:auto!important;animation:pulse 1s infinite alternate}@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.2)}}
  #overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:linear-gradient(rgba(7,12,10,.16),rgba(7,11,9,.74));z-index:10}.panel{width:min(690px,96vw);max-height:min(92vh,850px);overflow:auto;background:var(--glass2);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);border-radius:28px;padding:clamp(20px,4vw,34px);box-shadow:0 28px 78px rgba(0,0,0,.42);text-align:center}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:1000;text-transform:uppercase;color:var(--accent)}.title{font-size:clamp(38px,8vw,70px);line-height:.91;margin:8px 0 12px;font-weight:1000;letter-spacing:-.055em}.subtitle{font-size:clamp(15px,2.4vw,19px);color:#e8e7e0;line-height:1.45;max-width:550px;margin:0 auto 16px}.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:14px 0 20px}.chip{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.11);padding:7px 10px;border-radius:999px;font-size:12px;color:#f3f1ea}.bigbtn,.midbtn{border:0;border-radius:17px;background:linear-gradient(180deg,#ffe27a,#f1b63e);color:#302307;padding:13px 20px;font-size:18px;font-weight:1000;min-width:210px;box-shadow:0 7px 0 #9b6618,0 14px 29px rgba(0,0,0,.26);cursor:pointer}.midbtn{min-width:0;font-size:14px;padding:10px 14px;border-radius:13px;box-shadow:0 5px 0 #9b6618}.ghostbtn{border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(255,255,255,.07);color:white;padding:10px 14px;font-size:14px;font-weight:900;cursor:pointer}.bigbtn:active,.midbtn:active{transform:translateY(3px);box-shadow:0 4px 0 #9b6618}.ghostbtn:active{transform:scale(.98)}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.small{font-size:11px;color:#bfc3bb;margin-top:15px;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:11px 7px}.stat b{display:block;font-size:23px}.stat span{font-size:10px;color:#c8cbc5;text-transform:uppercase;letter-spacing:.075em}.tabs{display:flex;gap:6px;justify-content:center;margin:14px 0 17px;flex-wrap:wrap}.tab{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.06);color:#e9ebe5;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.tab.active{background:#f3c95f;color:#33270e;border-color:transparent}.shopGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;text-align:left}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.085);border-radius:17px;padding:13px}.card h3{font-size:14px;margin:0 0 4px}.card p{font-size:11px;line-height:1.4;color:#c8ccc5;margin:0 0 10px}.level{font-size:11px;color:#ffe083;font-weight:900;margin-bottom:7px}.shopBtn{width:100%;border:0;border-radius:11px;background:#f2ca62;color:#322710;padding:8px;font-size:12px;font-weight:1000}.shopBtn:disabled{opacity:.35}.skinSwatch{height:42px;border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden}.skinSwatch:after{content:"";position:absolute;left:15%;right:15%;bottom:8px;height:7px;border-radius:999px;background:rgba(255,255,255,.55)}.bank{font-size:14px;font-weight:1000;color:#ffe080;margin-bottom:8px}.notice{background:rgba(255,215,105,.11);border:1px solid rgba(255,215,105,.18);padding:10px 12px;border-radius:13px;font-size:12px;line-height:1.42;color:#f4edda;margin:10px 0}.achievement{display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;border-radius:13px;background:rgba(255,255,255,.05);margin:6px 0}.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e1b449;color:#2f240d;font-weight:1000;flex:0 0 auto}.achievement.locked{opacity:.42}.achievement b{font-size:12px}.achievement span{display:block;font-size:10px;color:#c6cac3;margin-top:1px}
  #toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.92);opacity:0;background:rgba(15,21,18,.86);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 14px;font-weight:1000;z-index:7;pointer-events:none;transition:.18s;max-width:82vw;text-align:center}.showToast{opacity:1!important;transform:translate(-50%,-50%) scale(1)!important}
  #banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:7;pointer-events:none;text-align:center;text-shadow:0 5px 18px rgba(0,0,0,.45);transition:.25s}.bannerShow{opacity:1!important;transform:translate(-50%,-50%) scale(1)!important}#banner b{display:block;font-size:clamp(27px,7vw,56px);line-height:.95}#banner span{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffe27d}
  @media (max-width:520px){#hud{left:6px;right:6px;gap:4px}.hudbox{padding:6px 5px;border-radius:12px}.hudbox .k{font-size:8px;letter-spacing:.07em}.hudbox .v{font-size:clamp(14px,4.4vw,18px)}#hud .missionBox{padding:5px 7px 6px}.mission{font-size:9px;margin-top:2px}.bar{margin-top:4px}#subHud{top:calc(max(7px,env(safe-area-inset-top)) + 101px);max-width:72vw;overflow:hidden}.pill{padding:5px 7px;font-size:9px}#actions{top:calc(max(7px,env(safe-area-inset-top)) + 105px);right:6px}.iconbtn{width:37px;height:37px;font-size:16px}.shopGrid{grid-template-columns:1fr}.panel{padding:20px 16px}.stats{gap:5px}.stat b{font-size:20px}}
  @media (min-width:900px){#controls{padding:0 25px 18px}.ctrl{width:72px;height:72px}.hudbox{padding:10px 14px}#subHud{top:128px}#actions{top:132px}}
  @media (prefers-reduced-motion:reduce){.boostReady{animation:none}#toast,#banner,.bar>i{transition:none}}
</style>

<body>
<div id="wrap">
  <canvas id="game" aria-label="Ronja Race – Schwarzwald Express"></canvas>
  <div id="hud" class="hidden">
    <div class="hudbox"><div class="k">Strecke</div><div class="v"><span id="distance">0</span> m</div></div>
    <div class="hudbox center"><div class="k">Punkte</div><div class="v" id="score">0</div></div>
    <div class="hudbox right"><div class="k">Herzen</div><div class="v">♥ <span id="coins">0</span></div></div>
    <div class="hudbox center missionBox"><div class="k">Mission</div><div class="mission" id="missionText">20 Herzen sammeln</div><div class="bar"><i id="missionBar"></i></div></div>
  </div>
  <div id="subHud" class="hidden"><span class="pill hot" id="comboPill">Combo ×1</span><span class="pill power" id="powerPill">Normalfahrt</span></div>
  <div id="actions" class="hidden"><button id="soundBtn" class="iconbtn" aria-label="Ton an oder aus">♪</button><button id="pauseBtn" class="iconbtn" aria-label="Pause">Ⅱ</button></div>
  <div id="controls" class="hidden">
    <div class="cluster"><button class="ctrl" data-act="left" aria-label="Nach links">◀</button><button class="ctrl" data-act="right" aria-label="Nach rechts">▶</button></div>
    <div class="cluster"><button class="ctrl" data-act="jump" aria-label="Springen">▲</button><button class="ctrl" data-act="duck" aria-label="Ducken">▼</button></div>
  </div>
  <button id="boostBtn" class="hidden" aria-label="Turbo aktivieren">⚡ TURBO</button>
  <div id="toast"></div><div id="banner"><span></span><b></b></div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false});
const overlay=$('overlay'),panel=$('panel'),hud=$('hud'),subHud=$('subHud'),controls=$('controls'),actions=$('actions'),boostBtn=$('boostBtn');
const distEl=$('distance'),scoreEl=$('score'),coinEl=$('coins'),missionEl=$('missionText'),missionBar=$('missionBar'),comboPill=$('comboPill'),powerPill=$('powerPill');
const soundBtn=$('soundBtn'),pauseBtn=$('pauseBtn'),toast=$('toast'),banner=$('banner');
let W=0,H=0,DPR=1,last=0,mode='menu',paused=false,audio=null,view='home',touchStart=null,now=0;
const MAXZ=1320, LANES=[-1,0,1], SAVE_KEY='ronjaRaceSaveV2';
const prefersReduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const defaultSave={version:3,best:0,bestScore:0,bank:0,totalHearts:0,runs:0,totalDistance:0,bestCombo:1,missions:0,sound:true,tutorialSeen:false,upgrades:{shield:0,magnet:0,luck:0,heart:0},skin:'berry',unlocked:['berry'],achievements:{}};
const SAVE_UPGRADE_MAX={shield:2,magnet:3,luck:3,heart:3},SAVE_SKINS=['berry','sun','forest','night'];
function clone(v){return JSON.parse(JSON.stringify(v))}
function num(v,d=0,min=0,max=1e9){v=Number(v);return Number.isFinite(v)?Math.min(max,Math.max(min,v)):d}
function sanitizeSave(raw){const s=clone(defaultSave),p=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};s.version=3;s.best=Math.floor(num(p.best,0));s.bestScore=Math.floor(num(p.bestScore,0));s.bank=Math.floor(num(p.bank,0));s.totalHearts=Math.floor(num(p.totalHearts,0));s.runs=Math.floor(num(p.runs,0));s.totalDistance=num(p.totalDistance,0);s.bestCombo=Math.floor(num(p.bestCombo,1,1,20));s.missions=Math.floor(num(p.missions,0));s.sound=p.sound!==false;s.tutorialSeen=p.tutorialSeen===true;const pu=p.upgrades&&typeof p.upgrades==='object'&&!Array.isArray(p.upgrades)?p.upgrades:{};for(const id of Object.keys(SAVE_UPGRADE_MAX))s.upgrades[id]=Math.floor(num(pu[id],0,0,SAVE_UPGRADE_MAX[id]));const arr=Array.isArray(p.unlocked)?p.unlocked.filter(x=>SAVE_SKINS.includes(x)):[];s.unlocked=[...new Set(['berry',...arr])];s.skin=SAVE_SKINS.includes(p.skin)&&s.unlocked.includes(p.skin)?p.skin:'berry';s.achievements=p.achievements&&typeof p.achievements==='object'&&!Array.isArray(p.achievements)?p.achievements:{};return s}
function loadSave(){let p=null;try{const oldBest=+(localStorage.getItem('ronjaRaceBest')||0),oldHearts=+(localStorage.getItem('ronjaRaceHearts')||0),raw=localStorage.getItem(SAVE_KEY);if(raw)p=JSON.parse(raw);else p={best:oldBest,bank:oldHearts,totalHearts:oldHearts}}catch(e){p=null}return sanitizeSave(p)}
let save=loadSave(),sound=save.sound!==false;
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));localStorage.setItem('ronjaRaceBest',String(save.best));localStorage.setItem('ronjaRaceHearts',String(save.totalHearts))}catch(e){}}
const skins={berry:{name:'Beerenrot',body:'#7b3049',cart:'#805b42',price:0},sun:{name:'Sonnenblitz',body:'#e5a22e',cart:'#916938',price:60},forest:{name:'Tannengrün',body:'#2d7157',cart:'#6f563e',price:90},night:{name:'Nachtfahrt',body:'#4b4d85',cart:'#443e4d',price:120}};
const upgrades={shield:{name:'Schutzstart',desc:'Beginne pro Stufe mit einem zusätzlichen Schutzschild.',max:2,cost:[45,100]},magnet:{name:'Stärkerer Magnet',desc:'Herz-Magnet hält pro Stufe 2 Sekunden länger.',max:3,cost:[35,65,110]},luck:{name:'Glücksradar',desc:'Power-ups erscheinen etwas häufiger.',max:3,cost:[40,75,120]},heart:{name:'Herzbonus',desc:'Am Ende gibt es pro Stufe 10 % mehr Bank-Herzen.',max:3,cost:[50,90,140]}};
const palettes=[
 {name:'Tannenwald',sky1:'#91cade',sky2:'#dceee0',ground:'#5a865f',track:'#786e61',tree:'#315f3d',accent:'#f7d981'},
 {name:'Dunkle Mine',sky1:'#182427',sky2:'#314044',ground:'#2b302d',track:'#2a2d2a',tree:'#26352f',accent:'#ffc866'},
 {name:'Holzbrücke',sky1:'#86bfdc',sky2:'#f0ddb8',ground:'#8c7958',track:'#83694f',tree:'#65835b',accent:'#f7e0a0'},
 {name:'Abenddorf',sky1:'#555b82',sky2:'#f19b79',ground:'#667257',track:'#76685c',tree:'#354436',accent:'#ffd46b'}
];
const world={distance:0,hearts:0,score:0,speed:250,baseSpeed:250,section:0,spawnMeter:70,pickMeter:35,shield:0,magnet:0,turbo:0,turboMeter:0,combo:1,comboTimer:0,bestCombo:1,nextCheckpoint:1000,nextBonus:2500,bonusTimer:0,bankBonus:0,missionRewards:0,checkpointRewards:0,settled:false,beat:0,shake:0,flash:0,lastLaneChangeAt:-99,tutorial:false,tutorialStage:0,stats:{jump:0,duck:0,lane:0,power:0},mission:null};
const player={lane:0,xLane:0,jumpY:0,jumpV:0,duck:0,tilt:0,bob:0};
let objects=[],particles=[];
const missions=[
 {type:'hearts',label:n=>n+' Herzen sammeln',target:20},
 {type:'distance',label:n=>n+' m fahren',target:700},
 {type:'jump',label:n=>n+' Hindernisse überspringen',target:4},
 {type:'duck',label:n=>n+' Schranken unterfahren',target:3},
 {type:'lane',label:n=>n+' Gefahren per Spurwechsel meiden',target:5},
 {type:'power',label:n=>n+' Power-up einsammeln',target:1}
];
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function startAudio(){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function beep(freq=440,dur=.05,type='sine',gain=.025){if(!sound)return;startAudio();if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function showToast(t,ms=900){toast.textContent=t;toast.classList.add('showToast');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('showToast'),ms)}
function showBanner(top,big,ms=1450){banner.querySelector('span').textContent=top;banner.querySelector('b').textContent=big;banner.classList.add('bannerShow');clearTimeout(showBanner.t);showBanner.t=setTimeout(()=>banner.classList.remove('bannerShow'),ms)}
function rr(x,y,w,h,r){const q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath()}
function box(x,y,w,h,r,fill,stroke){rr(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function setGameUi(on){[hud,subHud,controls,actions,boostBtn].forEach(el=>el.classList.toggle('hidden',!on));overlay.classList.toggle('hidden',on)}
function money(n){return Math.max(0,Math.floor(n))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMenu(next='home'){mode='menu';paused=false;view=next;setGameUi(false);overlay.classList.remove('hidden');
 const tabs='<div class="tabs"><button class="tab '+(view==='home'?'active':'')+'" data-view="home">Spielen</button><button class="tab '+(view==='garage'?'active':'')+'" data-view="garage">Werkstatt</button><button class="tab '+(view==='stats'?'active':'')+'" data-view="stats">Statistik</button></div>';

function chooseMission(exclude){let pool=missions.filter(m=>m.type!==exclude),m=pool[Math.floor(Math.random()*pool.length)],target=m.target;if(m.type==='distance')target+=Math.min(600,Math.floor(world.distance/1500)*100);if(m.type==='hearts')target+=Math.min(20,Math.floor(world.distance/1800)*5);return {type:m.type,target,label:m.label(target),start:metric(m.type),progress:0}}

function updateHud(){distEl.textContent=Math.floor(world.distance);scoreEl.textContent=Math.floor(world.score);coinEl.textContent=world.hearts;const mp=missionProgress();if(mp>=world.mission.target)completeMission();missionEl.textContent=world.mission.label;missionBar.style.width=Math.min(100,missionProgress()/world.mission.target*100)+'%';comboPill.textContent='Combo ×'+world.combo;let p='Normalfahrt';if(world.shield)p='◆ Schild '+world.shield;if(world.magnet>0)p='♥ Magnet '+Math.ceil(world.magnet)+'s';if(world.turbo>0)p='⚡ Turbo '+Math.ceil(world.turbo)+'s';powerPill.textContent=p;boostBtn.classList.toggle('boostReady',world.turboMeter>=100&&world.turbo<=0);boostBtn.textContent=world.turbo>0?'⚡ TURBO '+Math.ceil(world.turbo)+'s':'⚡ TURBO '+Math.floor(world.turboMeter)+'%'}

function depthT(z){return Math.min(1,Math.max(0,1-z/MAXZ))}
function laneX(lane,z){const t=depthT(z),spread=W*(.075+.28*t*t);return W/2+lane*spread}
function groundY(z){const horizon=H*.245,t=depthT(z);return horizon+(H-horizon)*(.055+.945*t*t)}
function scaleZ(z){const t=depthT(z);return .14+1.08*t*t}
function randLane(){return LANES[(Math.random()*3)|0]}
function addObstacle(type,lane,z=MAXZ){objects.push({kind:'obstacle',type,lane,z,hit:false,passed:false})}
function addHeart(lane,z){objects.push({kind:'heart',lane,z,hit:false,spin:Math.random()*6.28})}
function addPower(type,lane,z){objects.push({kind:'power',type,lane,z,hit:false,spin:0})}
function lineHearts(lane,z,count=5,step=62){for(let i=0;i<count;i++)addHeart(lane,z+i*step)}
function spawnPattern(){const z=MAXZ;if(world.tutorial&&world.tutorialStage<3){const seq=[['train',0,'← → SPUR WECHSELN'],['log',player.lane,'↑ SPRINGEN'],['barrier',player.lane,'↓ DUCKEN']],q=seq[world.tutorialStage++];objects.push({kind:'obstacle',type:q[0],lane:q[1],z,hit:false,passed:false,tutorial:q[2],hintShown:false});lineHearts(q[0]==='train'?(q[1]===0?-1:0):q[1],z+35,4,56);return}const r=Math.random(),safe=randLane();if(world.bonusTimer>0){lineHearts(randLane(),z,7,54);if(Math.random()<.28)addPower('magnet',randLane(),z+300);return}
 if(r<.18){const lane=randLane();addObstacle('train',lane,z);lineHearts(LANES.find(l=>l!==lane),z+70,5)}
 else if(r<.34){const lane=randLane();addObstacle('log',lane,z);for(let i=0;i<4;i++)addHeart(lane,z+18+i*58)}
 else if(r<.48){const lane=randLane();addObstacle('barrier',lane,z);lineHearts(lane,z+30,4)}
 else if(r<.60){const lane=randLane();addObstacle('crate',lane,z);for(let i=0;i<3;i++)addHeart(lane,z+25+i*62)}
 else if(r<.75){LANES.filter(l=>l!==safe).forEach((l,i)=>addObstacle(i?'crate':'train',l,z+i*18));lineHearts(safe,z+45,6)}
 else if(r<.87){LANES.forEach(l=>addObstacle('log',l,z));LANES.forEach(l=>addHeart(l,z+55))}
 else{LANES.forEach(l=>addObstacle('barrier',l,z));LANES.forEach(l=>addHeart(l,z+45))}}

function collectHeart(o){o.hit=true;world.hearts++;world.combo=Math.min(20,world.combo+1);world.comboTimer=3.3;world.bestCombo=Math.max(world.bestCombo,world.combo);world.score+=80*world.combo;world.turboMeter=Math.min(100,world.turboMeter+5.5);burst(laneX(o.lane,Math.max(20,o.z)),groundY(Math.max(20,o.z))-70*scaleZ(Math.max(20,o.z)),'heart',9);beep(660+Math.min(480,world.combo*20),.028,'triangle',.016)}
function collectPower(o){o.hit=true;world.stats.power++;if(o.type==='shield'){world.shield=Math.min(2,world.shield+1);showToast('◆ Schutzschild')}else if(o.type==='magnet'){world.magnet=7+(save.upgrades.magnet||0)*2;showToast('♥ Herz-Magnet')}else{world.turboMeter=Math.min(100,world.turboMeter+40);showToast('⚡ Turbo-Energie')}world.score+=250;beep(940,.095,'triangle',.04);vibrate(15)}
function obstacleSafe(o){if(world.turbo>0&&o.type!=='train')return true;if(o.type==='log')return player.jumpY>58;if(o.type==='crate')return player.jumpY>92;if(o.type==='barrier')return player.duck>.05;if(o.type==='puddle')return player.jumpY>25;return false}
function hitObstacle(o){o.hit=true;world.combo=1;world.comboTimer=0;if(world.shield>0){world.shield--;world.shake=.38;world.flash=.28;showToast('Schild gerettet!');beep(170,.08,'square',.035);vibrate(35);return}gameOver(o.type==='train'?'Die Lok kam näher als geplant.':'Autsch – Hindernis erwischt.')}
function passObstacle(o){if(o.passed)return;o.passed=true;const same=Math.abs(o.lane-player.xLane)<.44,safe=same&&obstacleSafe(o);if(safe){world.score+=120*world.combo;world.turboMeter=Math.min(100,world.turboMeter+4);if(o.type==='log'||o.type==='crate'){world.stats.jump++;showToast('Sauber gesprungen!',480)}if(o.type==='barrier'){world.stats.duck++;showToast('Perfekt geduckt!',480)}}else if(o.wasThreat&&!same&&now-o.threatAt<4){world.stats.lane++;world.score+=90*world.combo;world.turboMeter=Math.min(100,world.turboMeter+3);showToast('Sauber ausgewichen!',420)}}
function update(dt){if(mode!=='play'||paused)return;now+=dt;world.baseSpeed=Math.min(430,250+world.distance*.012);world.speed=world.baseSpeed+(world.turbo>0?100:0);const meters=world.speed*dt*.083;world.distance+=meters;world.score+=meters*10*(world.turbo>0?2:1);player.bob+=dt*(5+world.speed/100);player.xLane+=(player.lane-player.xLane)*Math.min(1,dt*11);player.tilt*=Math.pow(.05,dt);
 if(player.jumpV||player.jumpY>0){player.jumpY+=player.jumpV*dt;player.jumpV-=1160*dt;if(player.jumpY<=0){player.jumpY=0;player.jumpV=0}}player.duck=Math.max(0,player.duck-dt);world.magnet=Math.max(0,world.magnet-dt);world.turbo=Math.max(0,world.turbo-dt);world.shake=Math.max(0,world.shake-dt);world.flash=Math.max(0,world.flash-dt);world.bonusTimer=Math.max(0,world.bonusTimer-dt);
 if(world.comboTimer>0){world.comboTimer-=dt;if(world.comboTimer<=0)world.combo=1}
 const sec=Math.max(0,Math.floor(Math.max(0,world.distance)/1050))%palettes.length;if(sec!==world.section){world.section=sec;const section=palettes[sec]||palettes[0];showBanner('NEUER ABSCHNITT',section.name);beep(760,.075,'triangle',.03)}
 if(world.distance>=world.nextCheckpoint){save.bank+=3;world.checkpointRewards+=3;persist();showBanner('CHECKPOINT '+world.nextCheckpoint+' m','+3 ♥ SOFORT');world.nextCheckpoint+=1000;beep(820,.08,'triangle',.035)}
 if(world.distance>=world.nextBonus){world.bonusTimer=9;world.nextBonus+=2500;showBanner('BONUSRUNDE','HERZREGEN!');beep(980,.12,'triangle',.04)}
 if(world.tutorial&&world.tutorialStage>=3&&world.distance>=600){world.tutorial=false;save.tutorialSeen=true;persist();showBanner('TRAINING GESCHAFFT','JETZT FREIE FAHRT!')}
 world.spawnMeter-=meters;world.pickMeter-=meters;if(world.spawnMeter<=0){spawnPattern();world.spawnMeter=world.tutorial?130:(world.bonusTimer>0?38:68)+Math.random()*50}if(world.pickMeter<=0){spawnPickups();world.pickMeter=world.tutorial?120:(world.bonusTimer>0?42:115)+Math.random()*100}
 for(const o of objects){o.z-=world.speed*dt;if(o.hit)continue;o.spin=(o.spin||0)+dt*4;if(o.kind==='obstacle'){if(!o.hintShown&&o.tutorial&&o.z<620){o.hintShown=true;showBanner('TRAINING',o.tutorial,1000)}if(!o.wasThreat&&o.z<360&&o.z>120&&Math.abs(o.lane-player.xLane)<.44){o.wasThreat=true;o.threatAt=now}}if(o.kind==='heart'&&world.magnet>0&&o.z<300){o.lane+=(player.xLane-o.lane)*Math.min(1,dt*7.5)}if(o.kind==='obstacle'&&o.z<0)passObstacle(o);if(o.z<72&&o.z>-18&&Math.abs(o.lane-player.xLane)<.43){if(o.kind==='heart')collectHeart(o);else if(o.kind==='power')collectPower(o);else if(!obstacleSafe(o))hitObstacle(o);else{o.hit=true;passObstacle(o);burst(laneX(o.lane,35),groundY(35)-30,'spark',6)}if(mode!=='play')break}}
 if(mode!=='play')return;objects=objects.filter(o=>o.z>-160&&!o.hit);if(objects.length>130)objects=objects.slice(-130);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt});particles=particles.filter(p=>p.life>0).slice(-90);world.beat-=dt;if(world.beat<=0){world.beat=.48-Math.min(.12,world.speed/3500);beep(100,.022,'square',.006)}updateHud()}
function burst(x,y,type,n=8){if(prefersReduced)return;for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*150,vy:-40-Math.random()*170,life:.5+Math.random()*.45,type})}
function drawBackground(){const p=palettes[world.section],hy=H*.245,g=ctx.createLinearGradient(0,0,0,H*.58);g.addColorStop(0,p.sky1);g.addColorStop(1,p.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawSkyDetails(p,hy);drawMountains(p,hy);ctx.fillStyle=p.ground;ctx.fillRect(0,hy,W,H-hy);drawTrack(p,hy);drawScenery(p,hy);if(world.turbo>0)drawSpeedLines()}
function drawSkyDetails(p,hy){ctx.save();if(world.section===3){ctx.fillStyle='rgba(255,230,165,.78)';ctx.beginPath();ctx.arc(W*.79,hy*.42,Math.min(36,W*.06),0,7);ctx.fill()}else if(world.section===0||world.section===2){ctx.fillStyle='rgba(255,246,197,.64)';ctx.beginPath();ctx.arc(W*.82,hy*.35,Math.min(31,W*.055),0,7);ctx.fill()}if(world.section===1){for(let i=0;i<18;i++){ctx.fillStyle='rgba(255,210,110,'+(0.13+(i%3)*.05)+')';ctx.beginPath();ctx.arc((i*113+world.distance*1.3)%W,22+(i%6)*26,1.5+(i%2),0,7);ctx.fill()}}ctx.restore()}
function drawMountains(p,hy){ctx.fillStyle=world.section===1?'#1b2625':'rgba(52,79,65,.36)';ctx.beginPath();ctx.moveTo(0,hy);for(let x=-80;x<=W+80;x+=90){const y=hy-23-Math.sin((x+world.distance*.6)*.013)*19;ctx.lineTo(x,y)}ctx.lineTo(W,hy+15);ctx.lineTo(0,hy+15);ctx.closePath();ctx.fill();ctx.fillStyle=world.section===3?'rgba(47,56,51,.42)':'rgba(56,91,69,.27)';ctx.beginPath();ctx.moveTo(0,hy);for(let x=-80;x<=W+80;x+=110){const y=hy-45-Math.cos((x+world.distance*.3)*.01)*26;ctx.lineTo(x,y)}ctx.lineTo(W,hy);ctx.closePath();ctx.fill()}
function drawTrack(p,hy){const pts=[];for(let z=MAXZ;z>=0;z-=58){const y=groundY(z),t=1-z/MAXZ,half=W*(.09+.31*t*t);pts.push({z,y,l:W/2-half,r:W/2+half})}ctx.fillStyle=p.track;ctx.beginPath();ctx.moveTo(pts[0].l,pts[0].y);for(const q of pts)ctx.lineTo(q.l,q.y);for(let i=pts.length-1;i>=0;i--)ctx.lineTo(pts[i].r,pts[i].y);ctx.closePath();ctx.fill();LANES.forEach(l=>{for(const off of [-10,10]){ctx.strokeStyle=world.section===1?'#b8b7aa':'#423a32';ctx.lineWidth=2.1;ctx.beginPath();let first=true;for(let z=MAXZ;z>=0;z-=24){const x=laneX(l,z)+off*scaleZ(z),y=groundY(z);first?(ctx.moveTo(x,y),first=false):ctx.lineTo(x,y)}ctx.stroke()}});for(let z=(world.distance*18)%68;z<MAXZ;z+=68){const y=groundY(z),s=scaleZ(z);ctx.strokeStyle='rgba(67,50,38,.72)';ctx.lineWidth=Math.max(1,8*s);ctx.beginPath();ctx.moveTo(laneX(-1,z)-29*s,y);ctx.lineTo(laneX(1,z)+29*s,y);ctx.stroke()}}
function drawScenery(p,hy){const isTrees=world.section===0||world.section===3;for(let i=0;i<12;i++){const z=(i*121+world.distance*8.4)%MAXZ,y=groundY(z),s=scaleZ(z),side=i%2?-1:1,x=W/2+side*(W*.20+W*.39*(1-z/MAXZ)*(1-z/MAXZ));ctx.save();ctx.translate(x,y);ctx.scale(s,s);if(isTrees){ctx.fillStyle=world.section===3?'#2c3e32':p.tree;ctx.beginPath();ctx.moveTo(0,-150);ctx.lineTo(-52,-30);ctx.lineTo(52,-30);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,-112);ctx.lineTo(-65,10);ctx.lineTo(65,10);ctx.closePath();ctx.fill();ctx.fillStyle='#5a4431';ctx.fillRect(-7,8,14,50)}else if(world.section===2){ctx.fillStyle='#745138';ctx.fillRect(-8,-100,16,110);ctx.fillStyle='#a37852';ctx.fillRect(-52,-96,104,13)}else{ctx.fillStyle='#151c1a';ctx.beginPath();ctx.moveTo(-54,0);ctx.lineTo(-38,-105);ctx.lineTo(38,-105);ctx.lineTo(54,0);ctx.closePath();ctx.fill();ctx.fillStyle='#f0c563';ctx.beginPath();ctx.arc(0,-45,5,0,7);ctx.fill()}ctx.restore()}if(world.section===3)drawVillage(hy)}
function drawVillage(hy){for(let i=0;i<5;i++){const x=((i*227-world.distance*2.2)%(W+260))-80,y=hy-6,w=56+(i%2)*18,h=42+(i%3)*9;ctx.fillStyle='rgba(68,57,52,.72)';ctx.fillRect(x,y-h,w,h);ctx.fillStyle='rgba(255,211,111,.76)';ctx.fillRect(x+12,y-h+13,9,9);ctx.fillRect(x+w-21,y-h+13,9,9);ctx.fillStyle='#4a3a37';ctx.beginPath();ctx.moveTo(x-8,y-h);ctx.lineTo(x+w/2,y-h-27);ctx.lineTo(x+w+8,y-h);ctx.closePath();ctx.fill()}}
function drawSpeedLines(){ctx.save();ctx.strokeStyle='rgba(255,246,200,.22)';ctx.lineWidth=2;for(let i=0;i<18;i++){const x=(i*97+now*190)%W,y=H*.18+(i%9)*H*.09;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(i%2?20:-20),y+35);ctx.stroke()}ctx.restore()}
function drawHeart(x,y,r,c='#ff6682',rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,r*.9);ctx.bezierCurveTo(-r*1.2,r*.1,-r*.95,-r*.85,-r*.34,-r*.62);ctx.bezierCurveTo(0,-r*1.02,r*.34,-r*.62,r*.34,-r*.62);ctx.bezierCurveTo(r*.95,-r*.85,r*1.2,r*.1,0,r*.9);ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.62)';ctx.stroke();ctx.restore()}
function drawPower(o){const c=o.type==='shield'?'#77d9ff':o.type==='magnet'?'#ffdf70':'#fff092';ctx.save();ctx.rotate(Math.sin(o.spin)*.09);ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-62,31,0,7);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3.5;ctx.stroke();ctx.fillStyle='#263138';ctx.font='900 26px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.type==='shield'?'◆':o.type==='magnet'?'♥':'⚡',0,-61);ctx.restore()}
function drawObstacle(type){if(type==='train'){ctx.fillStyle='#b84542';box(-55,-156,110,156,18,'#b84542');box(-39,-130,78,50,8,'#27363b');ctx.fillStyle='#f7d160';ctx.beginPath();ctx.arc(-29,-36,9,0,7);ctx.arc(29,-36,9,0,7);ctx.fill();ctx.fillStyle='#3c3430';ctx.fillRect(-63,-13,126,17);ctx.fillStyle='#eee4c9';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText('EXPRESS',0,-93)}else if(type==='log'){box(-58,-29,116,29,14,'#714832');ctx.fillStyle='#956a4e';ctx.beginPath();ctx.arc(-47,-15,14,0,7);ctx.fill()}else if(type==='barrier'){ctx.fillStyle='#eeeae0';ctx.fillRect(-68,-112,12,112);ctx.fillRect(56,-112,12,112);ctx.fillRect(-56,-108,112,22);ctx.fillStyle='#e74d49';for(let x=-55;x<55;x+=28)ctx.fillRect(x,-108,16,22)}else{box(-44,-80,88,80,7,'#9d6c43');ctx.strokeStyle='#65442d';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-34,-69);ctx.lineTo(34,-11);ctx.moveTo(34,-69);ctx.lineTo(-34,-11);ctx.stroke()}}
function drawObjects(){const sorted=[...objects].sort((a,b)=>b.z-a.z);for(const o of sorted){if(o.z<0||o.z>MAXZ)continue;const x=laneX(o.lane,o.z),y=groundY(o.z),s=scaleZ(o.z);if(o.kind==='obstacle'&&o.z>150&&o.z<520){ctx.save();ctx.globalAlpha=.16+.18*(1-o.z/520);ctx.fillStyle=o.type==='train'?'#ff5f59':'#ffd96d';ctx.beginPath();ctx.ellipse(x,y,Math.max(10,48*s),Math.max(3,11*s),0,0,7);ctx.fill();ctx.restore()}ctx.save();ctx.translate(x,y);ctx.scale(s,s);if(o.kind==='heart')drawHeart(0,-66,19,'#ff6682',Math.sin(o.spin)*.12);else if(o.kind==='power')drawPower(o);else drawObstacle(o.type);ctx.restore()}}
function drawPlayer(){const skin=skins[save.skin]||skins.berry,x=laneX(player.xLane,0),base=H*.855-player.jumpY,duck=player.duck>0,bob=Math.sin(player.bob)*2.2,pump=Math.sin(player.bob*1.18)*.25;ctx.save();ctx.translate(x,base+bob);ctx.rotate(player.tilt*.045);if(world.shield){ctx.strokeStyle='rgba(124,222,255,.78)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,-88,78,109,0,0,7);ctx.stroke();if(world.shield>1){ctx.strokeStyle='rgba(124,222,255,.33)';ctx.beginPath();ctx.ellipse(0,-88,86,117,0,0,7);ctx.stroke()}}
 ctx.strokeStyle='#3d3128';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-63,-14);ctx.lineTo(-39,-62);ctx.lineTo(39,-62);ctx.lineTo(63,-14);ctx.stroke();box(-66,-53,132,38,12,skin.cart);ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(-49,2,18,0,7);ctx.arc(49,2,18,0,7);ctx.fill();ctx.strokeStyle='#b99a69';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-41,-58);ctx.lineTo(-56,-106);ctx.moveTo(41,-58);ctx.lineTo(56,-106);ctx.stroke();ctx.save();ctx.translate(0,-95);ctx.rotate(pump);ctx.strokeStyle='#34312e';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-42,0);ctx.lineTo(42,0);ctx.stroke();ctx.restore();
 const torsoY=duck?-119:-142,headY=duck?-145:-182;box(-39,torsoY,78,61,20,skin.body);ctx.strokeStyle='#e2aa86';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-31,torsoY+15);ctx.lineTo(-48+Math.sin(pump)*8,-95);ctx.moveTo(31,torsoY+15);ctx.lineTo(48-Math.sin(pump)*8,-95);ctx.stroke();ctx.fillStyle='#e5ad88';ctx.beginPath();ctx.arc(0,headY,35,0,7);ctx.fill();ctx.fillStyle='#2d201c';ctx.beginPath();ctx.arc(0,headY-11,37,Math.PI,Math.PI*2);ctx.lineTo(33,headY-8);ctx.bezierCurveTo(25,headY-34,-24,headY-36,-34,headY-7);ctx.fill();ctx.beginPath();ctx.arc(17,headY-47,15,0,7);ctx.fill();ctx.fillStyle='#4b3028';ctx.beginPath();ctx.ellipse(-12,headY-2,2.1,2.6,0,0,7);ctx.ellipse(12,headY-2,2.1,2.6,0,0,7);ctx.fill();ctx.strokeStyle='#663f35';ctx.lineWidth=2.3;ctx.beginPath();ctx.arc(0,headY+8,14,.15*Math.PI,.85*Math.PI);ctx.stroke();ctx.fillStyle='#f6e9db';ctx.font='1000 12px system-ui';ctx.textAlign='center';ctx.fillText('RONJA',0,torsoY+36);if(world.turbo>0){ctx.strokeStyle='rgba(255,227,105,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-72,-35);ctx.lineTo(-112,-23);ctx.moveTo(72,-35);ctx.lineTo(112,-23);ctx.stroke()}ctx.restore()}
function drawParticles(){for(const p of particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life);if(p.type==='heart')drawHeart(p.x,p.y,7,'#ff6e87',p.life);else{ctx.fillStyle='#ffe67b';ctx.fillRect(p.x,p.y,4,4)}ctx.restore()}}
function drawForeground(){if(world.flash>0){ctx.fillStyle='rgba(255,255,255,'+(world.flash*.35)+')';ctx.fillRect(0,0,W,H)}const g=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.25,W/2,H*.55,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.19)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function render(){ctx.save();if(world.shake>0&&!prefersReduced){const a=world.shake*8;ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a)}drawBackground();drawObjects();drawPlayer();drawParticles();drawForeground();if(paused){ctx.fillStyle='rgba(0,0,0,.30)';ctx.fillRect(0,0,W,H)}ctx.restore()}
function loop(t){const rawDt=(t-last)/1000;const dt=Math.max(0,Math.min(.034,Number.isFinite(rawDt)?rawDt:0));last=t;update(dt);render();requestAnimationFrame(loop)}
renderMenu('home');requestAnimationFrame(loop);
})();
