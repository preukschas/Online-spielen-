<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182f"><title>Code-Knacker · DMP Lernspiele</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7ff;background:#080d1d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#263b83 0,transparent 36rem),#080d1d}button{font:inherit;touch-action:manipulation;cursor:pointer}a{color:#9fd9ff}main{max-width:1050px;margin:auto;padding:18px 14px 38px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#8db7ff}.panel{background:#121a38;border:1px solid #334a8c;border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 20px 60px #0005}.hero h1{font-size:clamp(2.1rem,7vw,4.2rem);margin:6px 0;line-height:.95}.muted{color:#bec9ef;line-height:1.5}.game{display:grid;grid-template-columns:minmax(310px,1fr) minmax(280px,.8fr);gap:14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:1;gap:5px;background:#091127;padding:7px;border-radius:18px}.cell{position:relative;border-radius:10px;background:#1c2851;border:1px solid #364c88;display:grid;place-items:center;font-size:clamp(1.4rem,5vw,2.6rem)}.cell.wall{background:#29314a}.cell.target{box-shadow:inset 0 0 0 3px #71f0c7}.cell.star:after{content:'★';position:absolute;right:4px;top:1px;color:#ffd95e;font-size:1rem}.robot{display:grid;place-items:center;width:72%;height:72%;border-radius:50%;background:#8ed0ff;color:#0d1a35;font-weight:1000;transition:transform .2s}.commands,.program{display:flex;flex-wrap:wrap;gap:8px}.cmd{border:1px solid #5c77c6;background:#1b2a5a;color:white;border-radius:12px;padding:10px 12px;font-weight:850}.cmd.special{border-color:#7be6c0}.slot{background:#0d1530;border:1px dashed #52699f;border-radius:11px;padding:8px 10px}.primary{border:0;border-radius:14px;background:#a9f36f;color:#12231c;padding:12px 16px;font-weight:950}.secondary{border:1px solid #6077b6;background:#1b2851;color:white;border-radius:13px;padding:11px 14px;font-weight:800}.feedback{min-height:74px;padding:12px;border-radius:12px;background:#0c1430;border-left:4px solid #8db7ff;line-height:1.45}.hud{display:flex;gap:9px;flex-wrap:wrap}.pill{border:1px solid #4561a7;background:#192650;border-radius:999px;padding:7px 11px;font-weight:800}.hidden{display:none!important}@media(max-width:760px){.game{grid-template-columns:1fr}.panel{padding:15px}}
</style><link rel="stylesheet" href="../game-interaction-guard.css">\n</head><body><main><div class="top"><span class="brand">DMP Lernspiele · Coding</span><a href="https://preukschas.github.io/Online-spielen-/">Alle Lernspiele</a></div>
<section class="panel hero"><div class="brand">Programmiere den Roboter</div><h1>Code-Knacker 🤖</h1><p class="muted">Die Stadt ist verschwunden. Führe BYTE durch sechs Rätsel. Plane Befehle, starte das Programm und nutze den Schrittmodus zur Fehlersuche.</p><div class="hud"><span class="pill" id="level"></span><span class="pill" id="stars"></span><span class="pill" id="best"></span></div></section>
<section class="game"><div class="panel"><div id="grid" class="grid" aria-label="Stadtplan"></div></div><div class="panel"><h2 id="title"></h2><p id="goal" class="muted"></p><h3>Befehle</h3><div id="commands" class="commands"></div><h3>Programm <span id="limit" class="muted"></span></h3><div id="program" class="program"></div><p><button id="run" class="primary">▶ Programm starten</button> <button id="step" class="secondary">Einzelschritt</button> <button id="undo" class="secondary">↶</button> <button id="clear" class="secondary">Leeren</button></p><div id="feedback" class="feedback">Baue dein Programm.</div><p><button id="hint" class="secondary">Hinweis</button> <button id="next" class="primary hidden">Nächstes Rätsel →</button></p></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),dirs=[[0,-1],[1,0],[0,1],[-1,0]],icons=['↑','→','↓','←'];const puzzles=[{"t":"Tor 1 · Die Gasse","s":[0,4,0],"g":[0,0],"walls":[],"stars":[],"max":4,"cmd":["F"],"hint":"Vier Schritte geradeaus reichen."},{"t":"Tor 2 · Die Ecke","s":[0,4,0],"g":[3,2],"walls":[],"stars":[],"max":7,"cmd":["F","L","R"],"hint":"Erst nach oben, dann nach rechts."},{"t":"Tor 3 · Blockade","s":[0,4,0],"g":[4,0],"walls":[[0,2],[1,2],[2,2]],"stars":[],"max":10,"cmd":["F","L","R"],"hint":"Die Mauer zwingt dich rechts herum."},{"t":"Tor 4 · Wiederholen","s":[0,4,0],"g":[4,4],"walls":[],"stars":[],"max":6,"cmd":["F","L","R","FF"],"hint":"2× VOR spart einen Programmplatz."},{"t":"Tor 5 · Sternsensor","s":[4,4,0],"g":[0,2],"walls":[[1,3],[2,3],[3,3]],"stars":[[4,2]],"max":4,"cmd":["F","R","FF","IF"],"hint":"2× VOR bringt BYTE auf den Stern. Dort dreht WENN ★ → LINKS den Roboter nach links."},{"t":"Tor 6 · Zentrale","s":[4,4,3],"g":[0,0],"walls":[[3,3],[2,3],[1,1],[2,1],[3,1]],"stars":[[4,2]],"max":11,"cmd":["F","L","R","FF","IF"],"hint":"Nutze die freie Außenseite. Der Stern kann dir eine Drehung abnehmen."},{"t":"Tor 7 · U-Route","s":[0,4,0],"g":[4,4],"walls":[[1,4],[2,4],[3,4]],"stars":[],"max":8,"cmd":["F","L","R","FF"],"hint":"Unten ist blockiert. Fahre erst ganz nach oben, dann nach rechts und wieder nach unten."},{"t":"Tor 8 · Oberer Korridor","s":[0,4,0],"g":[4,0],"walls":[[0,2],[1,2],[2,2],[3,3]],"stars":[],"max":8,"cmd":["F","L","R","FF"],"hint":"Der direkte Weg ist gesperrt. Nutze die freie obere Reihe."},{"t":"Tor 9 · Sensor-Kurve","s":[0,0,2],"g":[4,2],"walls":[[1,3],[2,3],[3,3]],"stars":[[0,2]],"max":4,"cmd":["F","FF","IF"],"hint":"2× VOR bringt BYTE auf den Stern. Ohne LINKS-Karte musst du dort WENN ★ → LINKS einsetzen."},{"t":"Tor 10 · Meisterroute","s":[4,4,3],"g":[0,0],"walls":[[3,3],[1,3],[3,1],[1,1],[4,2]],"stars":[],"max":8,"cmd":["F","L","R","FF","IF"],"hint":"Denke in vier Abschnitten: links, hoch, links, hoch. 2× VOR spart Karten."}];const labels={F:'VOR',L:'LINKS',R:'RECHTS',FF:'2× VOR',IF:'WENN ★ → LINKS'};let n=0,prog=[],state=null,pc=0,running=false,won=false,total=0,best=0,key='dmp.code-knacker.best';try{best=Number(localStorage.getItem(key))||0}catch{}function resetState(){let p=puzzles[n];state={x:p.s[0],y:p.s[1],d:p.s[2]};pc=0;running=false;renderGrid()}function render(){let p=puzzles[n];won=false;['run','step','undo','clear'].forEach(id=>$(id).disabled=false);$('level').textContent='Rätsel '+(n+1)+' / '+puzzles.length;$('stars').textContent='Stadtsterne '+total;$('best').textContent='Bestwert '+best;$('title').textContent=p.t;$('goal').textContent='Bringe BYTE zum grünen Zielfeld. Mauern stoppen ihn.';$('limit').textContent='max. '+p.max+' Karten';let c=$('commands');c.replaceChildren();p.cmd.forEach(x=>{let b=document.createElement('button');b.className='cmd'+(x==='FF'||x==='IF'?' special':'');b.textContent=labels[x];b.onclick=()=>add(x);c.appendChild(b)});prog=[];renderProg();$('feedback').textContent='Baue dein Programm.';$('next').classList.add('hidden');resetState()}function renderGrid(){let p=puzzles[n],g=$('grid');g.replaceChildren();for(let y=0;y<5;y++)for(let x=0;x<5;x++){let c=document.createElement('div');c.className='cell';if(p.walls.some(w=>w[0]===x&&w[1]===y))c.classList.add('wall');if(p.g[0]===x&&p.g[1]===y)c.classList.add('target');if(p.stars.some(s=>s[0]===x&&s[1]===y))c.classList.add('star');if(state&&state.x===x&&state.y===y){let r=document.createElement('div');r.className='robot';r.textContent='🤖'+icons[state.d];c.appendChild(r)}g.appendChild(c)}}function add(x){if(running||won)return;let p=puzzles[n];if(prog.length>=p.max){$('feedback').textContent='Programm voll. Nutze Wiederholungen oder lösche eine Karte.';return}prog.push(x);renderProg()}function renderProg(){let box=$('program');box.replaceChildren();if(!prog.length){let s=document.createElement('span');s.className='muted';s.textContent='Noch leer';box.appendChild(s);return}prog.forEach((x,i)=>{let b=document.createElement('button');b.className='slot';b.textContent=(i+1)+'. '+labels[x];b.onclick=()=>{if(!running&&!won){prog.splice(i,1);renderProg()}};box.appendChild(b)})}function blocked(x,y){let p=puzzles[n];return x<0||y<0||x>4||y>4||p.walls.some(w=>w[0]===x&&w[1]===y)}function forward(){let d=dirs[state.d],nx=state.x+d[0],ny=state.y+d[1];if(blocked(nx,ny))return false;state.x=nx;state.y=ny;return true}function exec(cmd){if(cmd==='L')state.d=(state.d+3)%4;if(cmd==='R')state.d=(state.d+1)%4;if(cmd==='F'&&!forward())return 'wall';if(cmd==='FF'){if(!forward())return 'wall';if(!forward())return 'wall'}if(cmd==='IF'){let p=puzzles[n];if(p.stars.some(s=>s[0]===state.x&&s[1]===state.y))state.d=(state.d+3)%4}renderGrid();return 'ok'}function success(){let p=puzzles[n];return state.x===p.g[0]&&state.y===p.g[1]}function one(){if(won)return;if(!prog.length){$('feedback').textContent='Füge zuerst Befehle hinzu.';return}if(pc>=prog.length){$('feedback').textContent=success()?'Ziel erreicht!':'Programm zu Ende, aber BYTE ist noch nicht am Ziel.';if(success())win();return}let res=exec(prog[pc++]);if(res==='wall'){$('feedback').textContent='BYTE stößt an eine Mauer. Prüfe Schritt '+pc+'.';running=false;return}if(success()){win();return}$('feedback').textContent='Schritt '+pc+' ausgeführt.'}async function run(){if(running||won||!prog.length)return;resetState();running=true;$('feedback').textContent='Programm läuft …';while(running&&pc<prog.length){let res=exec(prog[pc++]);await new Promise(r=>setTimeout(r,360));if(res==='wall'){$('feedback').textContent='Mauer bei Schritt '+pc+'. Nutze den Einzelschritt zur Fehlersuche.';running=false;return}if(success()){win();return}}running=false;if(!success())$('feedback').textContent='Programm beendet. BYTE ist noch nicht im Ziel – ändere einzelne Karten.'}function win(){if(won)return;won=true;running=false;let p=puzzles[n],gain=Math.max(1,4-Math.max(0,prog.length-Math.ceil(p.max*.55)));total+=gain;best=Math.max(best,total);try{localStorage.setItem(key,best)}catch{}$('stars').textContent='Stadtsterne '+total;$('best').textContent='Bestwert '+best;$('feedback').textContent='Tor geöffnet! +'+gain+' Stadtsterne. Dein Programm hatte '+prog.length+' Karten.';$('next').classList.remove('hidden');['run','step','undo','clear'].forEach(id=>$(id).disabled=true);document.querySelectorAll('#commands button').forEach(b=>b.disabled=true)}function next(){if(n<puzzles.length-1){n++;render()}else{$('feedback').textContent='Die Stadt ist wieder online! Du hast alle zehn Tore programmiert. Starte noch einmal und versuche kürzere Programme.';$('next').textContent='Noch einmal';$('next').onclick=()=>{n=0;total=0;$('next').textContent='Nächstes Rätsel →';$('next').onclick=next;render()}}}$('run').onclick=run;$('step').onclick=()=>{if(!running)one()};$('undo').onclick=()=>{if(!running){prog.pop();renderProg()}};$('clear').onclick=()=>{if(!running){prog=[];renderProg();resetState()}};$('hint').onclick=()=>$('feedback').textContent=puzzles[n].hint;$('next').onclick=next;render()})();</script></body></html>
